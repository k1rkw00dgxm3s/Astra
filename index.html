<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }
        
        body {
            background-color: #327DA0;
            background-size: 300% 300%;
            animation: gradientAnimation 10s ease infinite;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Particle animation */
        canvas#particles {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        #browser-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            flex-direction: column;
            z-index: 1000;
        }

        #browser-container.active {
            display: flex;
        }

        .browser-toolbar {
            background: #f0f0f0;
            border-bottom: 1px solid #ccc;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .browser-nav-buttons {
            display: flex;
            gap: 5px;
        }

        .browser-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #999;
            background: #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .browser-btn:hover {
            background: #d0d0d0;
        }

        .browser-address-bar {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .browser-address-bar input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #999;
            border-radius: 20px;
            font-family: monospace;
            font-size: 12px;
        }

        .browser-address-bar button {
            width: 32px;
            height: 32px;
            border: 1px solid #999;
            background: #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
        }

        .browser-content {
            flex: 1;
            overflow: hidden;
        }

        .browser-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-browser {
            width: 32px;
            height: 32px;
            background: #ff5252;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }

        .landing-page {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000000;
        }

        .container {
            max-width: 400px;
            padding: 20px;
            background-color: #f4f4f4;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .title {
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input[type="text"] {
            width: 90%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-family: 'Montserrat', sans-serif;
        }

        .form-group input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #303030;
            color: #ffffff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
        }

        .form-group input[type="submit"]:hover {
            background-color: #3f3f3f;
        }

        button.blank-btn {
            width: 100%;
            padding: 10px;
            background-color: #282828;
            color: #ffffff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            margin-top: 10px;
        }

        button.blank-btn:hover {
            background-color: #3a3a3a;
        }

        ::-webkit-scrollbar {
            display: none;
        }
        scrollbar-width: none;
        -ms-overflow-style: none;

        @media screen and (min-width: 768px) {
            body {
                zoom: 125%;
            }
        }
    </style>
    <link href='https://fonts.googleapis.com/css2?family=Montserrat&display=swap' rel='stylesheet'>
    <title>Astra</title>
</head>
<body>
    <canvas id="particles"></canvas>
    
    <div class="landing-page content">
        <div class="container">
            <h1 class="title">Astra V1</h1>
            <p class="subtitle">Made by Josh</p>
            
            <form method="POST" action="/service/gateway">
                <div class="form-group">
                    <label for="url">URL</label>
                    <input type="text" id="url" name="url" placeholder="Enter URL" required>
                </div>
                <div class="form-group">
                    <input type="submit" value="Submit">
                </div>
            </form>
            <button class="blank-btn" onclick="openBlankCloak();">About:blank cloak</button>
            <button class="blank-btn" onclick="openBrowserUI();">Open in Browser</button>
        </div>
    </div>

    <div id="browser-container">
        <div class="browser-toolbar">
            <div class="browser-nav-buttons">
                <button class="browser-btn" onclick="browserBack();" title="Back">◀</button>
                <button class="browser-btn" onclick="browserForward();" title="Forward">▶</button>
                <button class="browser-btn" onclick="browserReload();" title="Reload">↻</button>
            </div>
            <div class="browser-address-bar">
                <input type="text" id="address-bar" placeholder="Enter URL..." value="">
                <button onclick="navigateBrowser();" title="Go">⏎</button>
            </div>
            <button class="browser-btn" onclick="toggleDevTools();" title="Developer Tools">⚙</button>
            <button class="close-browser" onclick="closeBrowser();">✕</button>
        </div>
        <div class="browser-content">
            <iframe id="browser-iframe" referrerpolicy="no-referrer" allow="fullscreen"></iframe>
        </div>
    </div>

    <script>
        // Particle system
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 50;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 2;
                this.speedY = (Math.random() - 0.5) * 2;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Browser UI functions
        function openBrowserUI() {
            const url = document.getElementById('url').value;
            if (!url) {
                alert('Please enter a URL');
                return;
            }
            document.getElementById('browser-container').classList.add('active');
            navigateToProxy(url);
        }

        function navigateToProxy(url) {
            const iframe = document.getElementById('browser-iframe');
            const addressBar = document.getElementById('address-bar');
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            const encodedUrl = encodeURIComponent(url);
            const proxyUrl = window.location.origin + '/service/gateway?url=' + encodedUrl;
            
            iframe.src = proxyUrl;
            addressBar.value = url;
        }

        function navigateBrowser() {
            const url = document.getElementById('address-bar').value;
            if (url) {
                navigateToProxy(url);
            }
        }

        function browserReload() {
            document.getElementById('browser-iframe').contentWindow.location.reload();
        }

        function browserBack() {
            document.getElementById('browser-iframe').contentWindow.history.back();
        }

        function browserForward() {
            document.getElementById('browser-iframe').contentWindow.history.forward();
        }

        function toggleDevTools() {
            alert('Developer Tools: You are accessing this page through the Astra proxy.');
        }

        function closeBrowser() {
            document.getElementById('browser-container').classList.remove('active');
        }

        function openBlankCloak() {
            (function () {
                var url = document.URL;
                var urlObj = new window.URL(window.location.href);
                win = window.open();
                win.document.body.style.margin = "0";
                win.document.body.style.height = "100vh";
                var iframe = win.document.createElement("iframe");
                iframe.style.border = "none";
                iframe.style.width = "100%";
                iframe.style.height = "100%";
                iframe.style.margin = "0";
                iframe.referrerpolicy = "no-referrer";
                iframe.allow = "fullscreen";
                iframe.src = url.toString();
                win.document.body.appendChild(iframe);
            })();
        }

        // Allow Enter key in address bar
        document.getElementById('address-bar').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                navigateBrowser();
            }
        });

        // Allow Enter key in main URL input
        document.getElementById('url').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                openBrowserUI();
            }
        });
    </script>
</body>
</html>
